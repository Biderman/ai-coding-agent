[project]
name = "aiagent"
version = "0.1.0"
description = "Educational AI coding agent with OpenRouter tool calling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = ["pytest", "debugpy"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "test_get_file_content.py"]
